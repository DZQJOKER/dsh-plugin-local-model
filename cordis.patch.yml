# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# This file is referenced by dsh.bundle.patch in package.json and is "the config layer this package contributes".
# When the profile's dsh.profile.bundles lists this package, this layer is applied — no manual --patch needed.
#
# Notes:
#   • name must be the **package name**, not a relative path — once the package is installed into the profile's node_modules,
#     relative paths cannot be resolved. Use an absolute path + --patch only for local debugging.
#   • Only write the fields you want to override; everything else is filled in by the plugin's schema defaults.
#   • User-level overrides (settings page / settings.yaml) take precedence over this file.
#   • id must be globally unique: cordis refuses to load a plugin tree with duplicate entry ids, and the plugin market
#     will uninstall a newly installed plugin whose id collides with an already loaded one (otherwise the profile won't start next time).
#     That's why the author prefix is used here instead of the bare 'local-model'.

- insert:
    - id: dzqjoker-local-model
      name: 'dsh-plugin-local-model'
      config:
        # Selected model (relative path under the models directory). Empty = not selected yet;
        # the first conversation then shows an actionable hint to pick a model in settings.
        selectedModel: ''

        # Idle unload: after this many minutes without conversation activity the model is unloaded and VRAM freed. 0 = disabled.
        idleUnloadMinutes: 5

        # Local service port; the dsh-side llm route must point at it.
        port: 18080

        # Context size. The context window declared by the dsh-side route follows this value (no longer configured separately).
        ctxSize: 8192

