# dsh 侧路由配置 —— 当插件无法自动注册时，把这段写进 $DSH_HOME/settings.yaml
#
# 什么时候需要它：
#   • 插件日志里出现「llm 服务未暴露可用的路由注册方法」；
#   • 或者在 Harness 设置 → 本地模型 里点「测试/查看路由」，插件会打印同样的内容。
#
# 关键点：路由名固定为 local-llama、model id 固定为 local（0.4.0 起它们已从设置里删除，
# 改为插件内的常量）。这样换模型文件时只改插件设置，dsh 侧配置一行都不用动。
#
# 已存在 providers 时，把 local-llama 这一段「并进」原来的 providers 下面，不要整体覆盖。

llm-pi-ai:
  providers:
    local-llama:
      displayName: 本地模型（llama.cpp）
      api: openai-completions
      baseURL: http://127.0.0.1:18080/v1
      # 本地模型吐字慢（尤其 CPU 推理），流式空闲超时必须放宽，
      # 否则会出现「模型明明在生成，客户端却超时断开」。
      streamIdleTimeoutMs: 600000
      models:
        - id: local
          name: 本地模型
          # 必须 <= 插件里的 ctxSize。插件自动注册时会把这里填成 ctxSize，
          # 手写配置时请自己跟上 —— 声明得比实际大，长会话会在中途断掉。
          contextWindow: 8192
          maxTokens: 8192
